[package]
name = "taro"
version = "0.1.0"
description = "Taro desktop app"
authors = ["Taro"]
edition = "2021"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-sql", "dep:keyring", "dep:base64", "dep:futures-util", "dep:notify", "dep:pdf-extract", "dep:portable-pty", "dep:regex", "dep:reqwest", "dep:tokio", "dep:tokio-util", "dep:globset", "dep:walkdir", "dep:scraper"]
desktop-tests = ["desktop", "tauri/test", "dep:gtk", "dep:webkit2gtk"]

[[test]]
name = "linux_desktop"
path = "tests/linux_desktop.rs"
required-features = ["desktop-tests"]

[[test]]
name = "foundation_ipc"
path = "tests/foundation_ipc.rs"
required-features = ["desktop-tests"]

[[bin]]
name = "taro"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
base64 = { version = "0.23.1", optional = true }
futures-util = { version = "0.3.34", optional = true }
globset = { version = "0.4.21", optional = true }
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"], optional = true }
notify = { version = "8", optional = true }
pdf-extract = { version = "0.12.1", optional = true }
portable-pty = { version = "0.9.0", optional = true }
regex = { version = "1.13.1", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"], optional = true }
rusqlite = { version = "0.32.1", features = ["bundled"] }
gtk = { version = "0.18.2", optional = true }
webkit2gtk = { version = "2.0.2", features = ["v2_40"], optional = true }
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
scraper = { version = "0.26", optional = true }
url = "2"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2.8.4", optional = true }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"], optional = true }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "time"], optional = true }
tokio-util = { version = "0.7.20", features = ["rt"], optional = true }
walkdir = { version = "2.5.0", optional = true }

[dev-dependencies]
lopdf = "0.42.0"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

