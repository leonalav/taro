name: Linux desktop compatibility
on:
  push:
    branches: [main, agent-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  native-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --lib
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev xvfb xauth dbus-x11
      - name: Prepare frontend assets and validate frontend
        run: |
          npm install --global pnpm@12.3.4
          pnpm install --frozen-lockfile
          pnpm test
          pnpm exec tsc --noEmit
          pnpm build
      - name: Test native targets and GTK/WebKit runtime
        run: bash scripts/test-linux-desktop.sh
